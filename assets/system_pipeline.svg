<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 130" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E15" />
      <stop offset="50%" stop-color="#0D141C" />
      <stop offset="100%" stop-color="#05080D" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="126" rx="8" fill="url(#bgGrad)" stroke="#1A2533" stroke-width="1.5" />

  <!-- Top Accent Rail -->
  <rect x="2" y="2" width="876" height="3" fill="url(#cyanLine)" />

  <!-- Stage 1 (x: 16 to 210, width: 194) -->
  <g transform="translate(16, 20)">
    <rect x="0" y="0" width="194" height="90" rx="6" fill="#0B1118" stroke="#1F2C3C" stroke-width="1" />
    <circle cx="16" cy="18" r="3.5" fill="#00D9FF" filter="url(#glow)" />
    <text x="26" y="21" fill="#00D9FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">01 / CAPTURE</text>
    <text x="16" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Data, Vision &amp; Streams</text>
    <text x="16" y="63" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5">Camera Feeds · Sensors · Audio</text>
    <text x="16" y="80" fill="#58A6FF" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="500">Vision · Sensors · APIs</text>
  </g>

  <!-- Connector 1 (x: 210 to 234) -->
  <g>
    <line x1="214" y1="65" x2="225" y2="65" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="225,62 230,65 225,68" fill="#00D9FF" />
  </g>

  <!-- Stage 2 (x: 234 to 428, width: 194) -->
  <g transform="translate(234, 20)">
    <rect x="0" y="0" width="194" height="90" rx="6" fill="#0B1118" stroke="#1F2C3C" stroke-width="1" />
    <circle cx="16" cy="18" r="3.5" fill="#00D9FF" filter="url(#glow)" />
    <text x="26" y="21" fill="#00D9FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">02 / INFERENCE</text>
    <text x="16" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">ML &amp; Applied AI</text>
    <text x="16" y="63" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5">YOLOv8n · ByteTrack · RAG</text>
    <text x="16" y="80" fill="#00D9FF" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="500">Tracking · Retrieval · Logic</text>
  </g>

  <!-- Connector 2 (x: 428 to 452) -->
  <g>
    <line x1="432" y1="65" x2="443" y2="65" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="443,62 448,65 443,68" fill="#00D9FF" />
  </g>

  <!-- Stage 3 (x: 452 to 646, width: 194) -->
  <g transform="translate(452, 20)">
    <rect x="0" y="0" width="194" height="90" rx="6" fill="#0B1118" stroke="#1F2C3C" stroke-width="1" />
    <circle cx="16" cy="18" r="3.5" fill="#FF7A00" filter="url(#glow)" />
    <text x="26" y="21" fill="#FF7A00" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">03 / SYSTEMS</text>
    <text x="16" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Edge, Telemetry &amp; APIs</text>
    <text x="16" y="63" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5">ONNX · FastAPI · Time-Series</text>
    <text x="16" y="80" fill="#FF7A00" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="500">Docker · Telemetry · APIs</text>
  </g>

  <!-- Connector 3 (x: 646 to 670) -->
  <g>
    <line x1="650" y1="65" x2="661" y2="65" stroke="#FF7A00" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="661,62 666,65 661,68" fill="#FF7A00" />
  </g>

  <!-- Stage 4 (x: 670 to 864, width: 194) -->
  <g transform="translate(670, 20)">
    <rect x="0" y="0" width="194" height="90" rx="6" fill="#0B1118" stroke="#1F2C3C" stroke-width="1" />
    <circle cx="16" cy="18" r="3.5" fill="#FF7A00" filter="url(#glow)" />
    <text x="26" y="21" fill="#FF7A00" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1">04 / IMPACT</text>
    <text x="16" y="44" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600">Decisions &amp; Applications</text>
    <text x="16" y="63" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9.5">Analytics · Alerts · Insights</text>
    <text x="16" y="80" fill="#58A6FF" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="500">Dashboards · Guidance · HUD</text>
  </g>
</svg>
